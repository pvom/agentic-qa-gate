name: agentic-qa-gate
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The checks are NOT listed here. They are declared once in
      # .portao-entrega/config.json, which the local pre-commit gate reads too.
      # Two enforcers, one declaration — so they cannot drift apart.
      - name: Run the declared gate
        run: |
          node -e '
            const {execSync} = require("child_process");
            const c = require("./.portao-entrega/config.json");
            const cmds = [c.typecheck, ...(c.suite || [])].filter(Boolean);
            let failed = [];
            for (const cmd of cmds) {
              process.stdout.write("\n==> " + cmd + "\n");
              try { execSync(cmd, {stdio: "inherit", cwd: c.dir || "."}); }
              catch (e) { failed.push(cmd); }
            }
            if (failed.length) {
              process.stdout.write("\nGATE BLOCKED — failed: " + failed.join(" · ") + "\n");
              process.exit(1);
            }
            process.stdout.write("\nGATE PASSED — " + cmds.length + " checks\n");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
